<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ТРПУ-17</title>
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #121212;
            --bg-secondary: #1a1a1a;
            --bg-card: #1e1e1e;
            --bg-card-hover: #282828;
            --text-primary: #e8e8e8;
            --text-secondary: #b0b0b0;
            --accent: #ff8c00;
            --accent-glow: rgba(255, 140, 0, 0.3);
            --border-color: #2a2a2a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --digital-green: #39ff14;
            --digital-glow: rgba(57, 255, 20, 0.25);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== СТАТИЧЕСКАЯ ЧАСТЬ ===== */
        .static-section {
            flex: 0 0 auto;
            background: var(--bg-secondary);
            padding: 12px 16px 10px 16px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
            position: relative;
        }

        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .table-container::-webkit-scrollbar { display: none; }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            min-width: 340px;
            font-size: 13px;
        }

        .table-grid .header-cell {
            background: var(--bg-card);
            padding: 6px 4px;
            text-align: center;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-bottom: 2px solid var(--accent);
        }

        .table-grid .cell {
            background: var(--bg-card);
            padding: 7px 4px;
            text-align: center;
            border-radius: 4px;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .table-grid .cell:active {
            transform: scale(0.96);
        }

        .table-grid .cell.active {
            background: var(--accent) !important;
            color: #121212 !important;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(1.02);
            font-weight: 700;
        }

        /* Вспышка при тапе */
        .table-grid .cell.flash {
            animation: flashCell 0.4s ease;
        }

        @keyframes flashCell {
            0% { background: var(--bg-card); }
            30% { background: var(--accent); transform: scale(1.06); }
            100% { background: var(--accent); transform: scale(1.02); }
        }

        .table-grid .cell.signal { color: #ff6b6b; font-weight: 600; }
        .table-grid .cell.signal-green { color: #51cf66; font-weight: 600; }
        .table-grid .cell.signal-yellow { color: #fcc419; font-weight: 600; }
        .table-grid .cell.signal-white { color: #e8e8e8; font-weight: 600; }
        .table-grid .cell.accent { color: var(--accent); font-weight: 600; }
        .table-grid .cell.digital {
            color: var(--digital-green);
            font-weight: 600;
            text-shadow: 0 0 6px var(--digital-glow), 0 0 12px rgba(57, 255, 20, 0.1);
        }

        /* ===== ДИНАМИЧЕСКАЯ ЧАСТЬ ===== */
        .dynamic-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px 16px 20px 16px;
            overflow: hidden;
            min-height: 0;
        }

        /* ===== БЛОК УПРАВЛЕНИЯ СИГНАЛАМИ + КНОПКА КОМАНДЫ ===== */
        .signal-block {
            flex: 0 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 6px 8px;
            margin-bottom: 12px;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 8px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.15s;
        }

        .signal-block:active {
            background: var(--bg-card);
        }

        .commands-btn {
            background: var(--bg-card);
            color: var(--accent);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            min-height: 48px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .commands-btn:active {
            transform: scale(0.95);
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .signal-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }

        .signal-btn {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            min-width: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            line-height: 1;
            touch-action: none;
            padding: 0 4px;
        }

        .signal-btn:active {
            transform: scale(0.92);
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .signal-btn:disabled {
            opacity: 0.2;
            transform: none;
            pointer-events: none;
        }

        .signal-counter {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            min-width: 56px;
            text-align: center;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .signal-reset {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 6px 8px;
            transition: all 0.2s;
            line-height: 1;
            min-height: 40px;
            min-width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
        }

        .signal-reset:active {
            background: var(--bg-card);
            color: var(--text-primary);
            transform: scale(0.92);
        }

        /* ===== МОДАЛЬНОЕ ОКНО КОМАНД ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px 18px;
            max-width: 380px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
            min-height: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:active {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: scale(0.92);
        }

        .commands-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .command-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border-left: 3px solid var(--accent);
        }

        .command-code {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .command-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* ===== ПРОГРЕСС ===== */
        .progress-container {
            flex: 0 0 auto;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 4px;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #ffb347);
            border-radius: 8px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .progress-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 38px;
            text-align: right;
        }

        /* ===== КАРТОЧКА ШАГА ===== */
        .step-card {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 18px 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            min-height: 0;
        }

        .step-number {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .step-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .step-description {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .step-description::-webkit-scrollbar { width: 3px; }
        .step-description::-webkit-scrollbar-track { background: transparent; }
        .step-description::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 8px; }

        /* ===== ТАЙМЕР ===== */
        .timer-container {
            margin: 12px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .timer-display {
            font-size: 24px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--digital-green);
            text-shadow: 0 0 10px var(--digital-glow);
            min-width: 54px;
            text-align: center;
            letter-spacing: 1px;
        }

        .timer-label {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
        }

        /* ===== КНОПКИ НАВИГАЦИИ ===== */
        .nav-buttons {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            padding: 12px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn:active { transform: scale(0.97); }

        .btn-back {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-back:active { background: var(--bg-card-hover); }
        .btn-back:disabled { opacity: 0.3; transform: none; }

        .btn-next {
            background: linear-gradient(135deg, var(--accent), #e67e00);
            color: #121212;
            box-shadow: 0 4px 16px rgba(255, 140, 0, 0.25);
        }
        .btn-next:active { box-shadow: 0 2px 8px rgba(255, 140, 0, 0.15); }
        .btn-next:disabled { opacity: 0.4; transform: none; box-shadow: none; }

        .btn-finish {
            background: linear-gradient(135deg, #00b894, #00a381);
            color: #121212;
            box-shadow: 0 4px 16px rgba(0, 184, 148, 0.25);
        }

        /* ===== ФИНАЛЬНЫЙ ЭКРАН ===== */
        .finish-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 14px;
        }

        .finish-icon { font-size: 48px; line-height: 1; }
        .finish-title { font-size: 20px; font-weight: 700; color: var(--text-primary); }
        .finish-sub { font-size: 15px; color: var(--text-secondary); max-width: 300px; line-height: 1.5; }
        .finish-reset {
            margin-top: 16px;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 12px 36px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
        }
        .finish-reset:active { background: var(--bg-card-hover); }

        /* ===== АНИМАЦИЯ ===== */
        .step-card { animation: fadeSlide 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== PWA БАННЕР ===== */
        .install-banner {
            display: none;
            background: var(--bg-card);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .install-banner.show { display: flex; }
        .install-banner .btn-install {
            background: var(--accent);
            color: #121212;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            min-height: 34px;
        }
        .install-banner .btn-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 380px) {
            .static-section { padding: 8px 10px 6px 10px; }
            .table-grid { font-size: 11px; min-width: 280px; gap: 3px; }
            .table-grid .cell { padding: 5px 2px; font-size: 11px; }
            .table-grid .header-cell { font-size: 9px; padding: 4px 2px; }
            .step-card { padding: 14px 12px; }
            .step-title { font-size: 14px; }
            .step-description { font-size: 13px; }
            .dynamic-section { padding: 10px 10px 14px 10px; }
            .btn { font-size: 14px; min-height: 44px; padding: 10px 12px; }
            .timer-display { font-size: 20px; min-width: 44px; }

            .signal-btn { font-size: 20px; min-height: 44px; min-width: 46px; }
            .signal-counter { font-size: 16px; min-width: 48px; }
            .signal-block { min-height: 50px; padding: 4px 6px; }
            .signal-reset { font-size: 18px; min-height: 36px; min-width: 36px; }
            .commands-btn { font-size: 10px; padding: 0 10px; min-height: 44px; }
        }

        @media (min-width: 600px) {
            body { max-width: 420px; margin: 0 auto; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); }
            .static-section { padding: 16px 20px 12px 20px; }
            .dynamic-section { padding: 16px 20px 24px 20px; }
            .step-card { padding: 22px 20px; }
        }

        @supports (padding: max(0px)) {
            .static-section { padding-top: max(12px, env(safe-area-inset-top)); }
            .dynamic-section { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

    <!-- ===== СТАТИЧЕСКАЯ ЧАСТЬ ===== -->
    <div class="static-section">
        <div class="table-container">
            <div class="table-grid" id="signalTable">
                <div class="header-cell"></div>
                <div class="header-cell"></div>
                <div class="header-cell"></div>
                <div class="header-cell"></div>

                <div class="cell signal" data-signal="0">КЖ</div>
                <div class="cell accent" data-signal="0">Подтяг</div>
                <div class="cell digital" data-signal="0">600</div>
                <div class="cell digital" data-signal="0">17</div>

                <div class="cell signal" data-signal="1">Красный</div>
                <div class="cell accent" data-signal="1">К20</div>
                <div class="cell digital" data-signal="1">300</div>
                <div class="cell digital" data-signal="1">17</div>

                <div class="cell signal-green" data-signal="2">Зеленый</div>
                <div class="cell accent" data-signal="2">К20</div>
                <div class="cell digital" data-signal="2">300</div>
                <div class="cell digital" data-signal="2">17</div>

                <div class="cell signal-white" data-signal="3">Белый</div>
                <div class="cell accent" data-signal="3">Отправление</div>
                <div class="cell digital" data-signal="3">500</div>
                <div class="cell digital" data-signal="3">52</div>

                <div class="cell signal-yellow" data-signal="4">Желтый</div>
                <div class="cell accent" data-signal="4">ОС</div>
                <div class="cell digital" data-signal="4">600</div>
                <div class="cell digital" data-signal="4">62/82</div>

                <div class="cell signal-white" data-signal="5">Белый</div>
                <div class="cell accent" data-signal="5">Отправление</div>
                <div class="cell digital" data-signal="5">500</div>
                <div class="cell digital" data-signal="5">52</div>
            </div>
        </div>
    </div>

    <!-- ===== ДИНАМИЧЕСКАЯ ЧАСТЬ ===== -->
    <div class="dynamic-section">

        <div class="install-banner" id="installBanner">
            <span style="flex:1;">📱 Установите как приложение</span>
            <button class="btn-install" id="installBtn">Установить</button>
            <button class="btn-close" id="installClose">✕</button>
        </div>

        <!-- ===== БЛОК УПРАВЛЕНИЯ: КОМАНДЫ + СИГНАЛЫ ===== -->
        <div class="signal-block" id="signalBlock">
            <button class="commands-btn" id="commandsBtn" title="Список команд">Команды</button>
            <div class="signal-controls">
                <button class="signal-btn" id="signalPrev" title="Предыдущий сигнал">◄</button>
                <span class="signal-counter" id="signalCounter">1/12</span>
                <button class="signal-btn" id="signalNext" title="Следующий сигнал">►</button>
                <button class="signal-reset" id="signalReset" title="Сбросить на КЖ">⟳</button>
            </div>
        </div>

        <!-- Прогресс -->
        <div class="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">0%</span>
        </div>

        <!-- Контент шагов -->
        <div id="contentArea"></div>

    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО КОМАНД ===== -->
    <div class="modal-overlay" id="commandsModal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Команды</span>
                <button class="modal-close" id="modalClose" title="Закрыть">✕</button>
            </div>
            <div class="commands-list">
                <div class="command-item">
                    <div class="command-code">К71</div>
                    <div class="command-desc">Постоянные признаки</div>
                </div>
                <div class="command-item">
                    <div class="command-code">К70</div>
                    <div class="command-desc"></div>
                </div>
                <div class="command-item">
                    <div class="command-code">К81</div>
                    <div class="command-desc">ТЦ ТМ</div>
                </div>
                <div class="command-item">
                    <div class="command-code">К80</div>
                    <div class="command-desc">(завышаем в 1-ое положение)</div>
                </div>
                <div class="command-item">
                    <div class="command-code">К517</div>
                    <div class="command-desc">Пакет по контрольной сумме</div>
                </div>
                <div class="command-item">
                    <div class="command-code">К5</div>
                    <div class="command-desc">Характеристики КЛУБ</div>
                </div>
                <div class="command-item">
                    <div class="command-code">Л</div>
                    <div class="command-desc"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // ДАННЫЕ
        // ============================================================

        const BASE_SIGNALS_COUNT = 6;
        const TOTAL_SIGNALS = 12;

        const steps = [{
            id: 1,
            title: 'Проверка журнала',
            description: 'Выполняем проверку журнала, интересуют замечания оставленные бригадами.'
        }, {
            id: 2,
            title: 'Подготовка кабины',
            description: 'Заходим в кабину, вешаем БВДУ, переключаем тумблер в одиночный, вставляем кассету, включаем САУТ.'
        }, {
            id: 3,
            title: 'Служебное торможение',
            description: 'Проверяем служебное торможение, смотрим давление в ТМ/УР — должно быть 5 атмосфер. Переключаем тумблер с АЛС в САУТ на пульте управления.'
        }, {
            id: 4,
            title: 'Подключение ПД',
            description: 'Подключаем ПД, заходим в приложение имитация скорости.'
        }, {
            id: 5,
            title: 'Включение КЛУБ',
            description: 'Включаем КЛУБ. На БВДУ включаем режим БПИ. На БИЛ УТ проверяем индикатор наличия кассеты. Проверяем грузовой/одиночный.'
        }, {
            id: 6,
            title: 'Номер электронной карты',
            description: 'Включаем ЭПК, поворачиваем ключ против часовой стрелки, вводим команду К10 — узнаем номер электронной карты. Актуальный номер указан на БВДУ сзади.'
        }, {
            id: 7,
            title: 'Восстановление давления',
            description: 'Восстанавливаем давление в ТМ/УР путем включения/выключения тумблера АЛС-САУТ на пульте управления.'
        }, {
            id: 8,
            title: 'ТСКБМ и функция скатывания',
            description: 'Включаем ТСКБМ. По истечении 1 минуты проверяем функцию скатывания. Вводим команду К1045. РБ не реагирует, РБС реагирует.',
            timer: 60
        }, {
            id: 9,
            title: 'Перешивка электронной карты',
            description: 'Если электронная карта актуальная — отключаем БВДУ. Если не актуальная — ставим на перешивку (команда П0 или деактивация). Шьём на БВДУ в режиме БПИ: два раза вниз, ввод, вверх, ввод, вверх, ввод, влево, вниз, ввод.'
        }, {
            id: 10,
            title: 'Проверка частот 25/75 Гц и ЕН',
            description: 'Проверяем 2 круга 25 Гц, 2 круга 75 Гц и 1 круг ЕН. Частоты переключаем буквой F. На ЕН — К137 ввод 4 ввод. Выход: К137 ввод 0 ввод. При прогоне в ЕН переключить САУТ в режим АЛС (иначе сработает ПЭКМ).'
        }, {
            id: 11,
            title: 'Экстренное торможение',
            description: 'После желтого проверяем кнопку РПМ (должен переключиться на маневровый, загореться белый огонь). На ПД задаем 15 км/ч. Ждем экстренное торможение через ПЭКМ (снижение давления 0.6-0.7 со свистом ЭПК). Нажимаем "Отправление" — фактическая и допустимая уравниваются.'
        }, {
            id: 12,
            title: 'Контроль тяги, КОН и ЭПК',
            description: 'Штурвал вперед и в положение П. Ждем 76 секунд. По команде К71 пропадает признак 3, срыв ЭПК (7+1.5 сек). Выключаем ключом ЭПК, ждем 12±2 сек — срывает КОН. Штурвал в "0" — срыв прекращается.',
            timer: 76
        }, {
            id: 13,
            title: 'Команды К71, К81, К80, К517, К5',
            description: 'К71 — постоянные признаки (123456789-В-).\nК81 — ТЦ.\nК80 — ТМ (завышаем давление краном в 1-ое положение).\nК517 — пакет по контрольной сумме.\nК5 — характеристики КЛУБ (тип, номер, бандажи, зубья, конфигурация, скорости, длина блок-участка).'
        }, {
            id: 14,
            title: 'АЛСН, САУТ, база данных',
            description: 'В режиме АЛСН на ПУ проверяем АЧХ, ОФМ, информацию САУТ (тип, номер, кабина, КЛУБ, АЛСН, КПД, ЕКС, режим). Если база не актуальна — прошиваем через работу с памятью. Считываем РПС.'
        }];

        // ============================================================
        // СОСТОЯНИЕ СИГНАЛОВ
        // ============================================================

        let startSignalIndex = 0;   // стартовая строка (0–5), выбранная тапом
        let signalStep = 0;         // текущий шаг от 0 до 11 (счётчик 1/12)

        let currentStep = 0;        // текущий шаг диагностики

        let timerInterval = null;
        let timerSeconds = 0;
        let timerTotal = 0;
        let isTimerRunning = false;

        const contentArea = document.getElementById('contentArea');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');

        const signalBlock = document.getElementById('signalBlock');
        const signalCounterEl = document.getElementById('signalCounter');
        const signalPrevBtn = document.getElementById('signalPrev');
        const signalNextBtn = document.getElementById('signalNext');
        const signalResetBtn = document.getElementById('signalReset');

        const commandsBtn = document.getElementById('commandsBtn');
        const commandsModal = document.getElementById('commandsModal');
        const modalClose = document.getElementById('modalClose');

        // ============================================================
        // ЛОГИКА СИГНАЛОВ
        // ============================================================

        // Индекс строки в таблице (0–5) = (start + step) % 6
        function getTableIndex() {
            return (startSignalIndex + signalStep) % BASE_SIGNALS_COUNT;
        }

        // Обновить подсветку и счётчик
        function refreshSignalUI() {
            signalCounterEl.textContent = `${signalStep + 1}/${TOTAL_SIGNALS}`;
            signalPrevBtn.disabled = signalStep === 0;
            signalNextBtn.disabled = signalStep >= TOTAL_SIGNALS - 1;
            highlightTableRow(getTableIndex());
        }

        // Подсветка строки таблицы по индексу 0–5
        function highlightTableRow(baseIndex) {
            document.querySelectorAll('.table-grid .cell').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll(`.table-grid .cell[data-signal="${baseIndex}"]`).forEach(el => {
                el.classList.add('active');
            });
        }

        // Прокрутить на следующий сигнал
        function nextSignal() {
            if (signalStep < TOTAL_SIGNALS - 1) {
                signalStep++;
                refreshSignalUI();
                vibrate(8);
            }
        }

        // Прокрутить назад
        function prevSignal() {
            if (signalStep > 0) {
                signalStep--;
                refreshSignalUI();
                vibrate(8);
            }
        }

        // Сброс на КЖ
        function resetSignal() {
            startSignalIndex = 0;
            signalStep = 0;
            refreshSignalUI();
            vibrate(12);
        }

        // Тап по строке таблицы — выбор стартовой точки
        function selectStartSignal(tableIndex, cellEl) {
            startSignalIndex = tableIndex;
            signalStep = 0;

            // Вспышка ячейки
            cellEl.classList.add('flash');
            setTimeout(() => cellEl.classList.remove('flash'), 400);

            refreshSignalUI();
            vibrate(12);
        }

        // Обработчик тапа на ячейки таблицы
        function setupTableTapHandlers() {
            document.querySelectorAll('.table-grid .cell').forEach(cell => {
                cell.addEventListener('click', () => {
                    const idx = parseInt(cell.getAttribute('data-signal'), 10);
                    if (!isNaN(idx)) {
                        selectStartSignal(idx, cell);
                    }
                });
            });
        }

        // ============================================================
        // МОДАЛЬНОЕ ОКНО КОМАНД
        // ============================================================

        function openModal() {
            commandsModal.classList.add('show');
            vibrate(10);
        }

        function closeModal() {
            commandsModal.classList.remove('show');
        }

        commandsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openModal();
        });

        modalClose.addEventListener('click', closeModal);

        commandsModal.addEventListener('click', (e) => {
            if (e.target === commandsModal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ============================================================
        // ВИБРАЦИЯ
        // ============================================================

        function vibrate(duration = 10) {
            try {
                if (navigator.vibrate) {
                    navigator.vibrate(duration);
                }
            } catch (_) {}
        }

        // ============================================================
        // СВАЙП-УПРАВЛЕНИЕ
        // ============================================================

        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;
        let touchTarget = null;

        signalBlock.addEventListener('touchstart', (e) => {
            // Игнорируем свайп, если касание началось на кнопке КОМАНДЫ
            if (e.target.closest('.commands-btn')) return;

            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isSwiping = false;
            touchTarget = e.target;
        }, { passive: true });

        signalBlock.addEventListener('touchmove', (e) => {
            if (touchStartX === 0) return;
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;

            if (Math.abs(deltaX) > 10 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
                isSwiping = true;
                e.preventDefault();
            }
        }, { passive: false });

        signalBlock.addEventListener('touchend', (e) => {
            if (touchStartX === 0) return;
            if (!isSwiping) {
                touchStartX = 0;
                return;
            }

            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;

            if (Math.abs(deltaX) > 30) {
                if (deltaX < 0) {
                    nextSignal();
                } else {
                    prevSignal();
                }
            }

            touchStartX = 0;
            touchStartY = 0;
            isSwiping = false;
            touchTarget = null;
        }, { passive: true });

        // ============================================================
        // ОТРИСОВКА ШАГОВ ДИАГНОСТИКИ
        // ============================================================

        function render() {
            const total = steps.length;

            if (currentStep >= total) {
                renderFinish();
                updateProgress(100);
                return;
            }

            const step = steps[currentStep];
            const progress = Math.round(((currentStep) / total) * 100);
            updateProgress(progress);

            const hasTimer = step.timer && step.timer > 0;

            if (hasTimer && !isTimerRunning) {
                timerTotal = step.timer;
                timerSeconds = 0;
                startTimer();
            }

            let html = `
                <div class="step-card">
                    <div class="step-number">Шаг ${currentStep + 1} из ${total}</div>
                    <div class="step-title">${step.title}</div>
                    <div class="step-description">${step.description.replace(/\n/g, '<br>')}</div>
            `;

            if (hasTimer) {
                const remaining = Math.max(0, timerTotal - timerSeconds);
                html += `
                    <div class="timer-container">
                        <span class="timer-display" id="timerDisplay">${formatTime(remaining)}</span>
                        <span class="timer-label" id="timerLabel">${remaining > 0 ? 'Ожидание...' : 'Готово!'}</span>
                    </div>
                `;
            }

            const isFirst = currentStep === 0;
            const isLast = currentStep === total - 1;

            html += `
                    <div class="nav-buttons">
                        <button class="btn btn-back" id="backBtn" ${isFirst ? 'disabled' : ''}>
                            ← Назад
                        </button>
                        <button class="btn ${isLast ? 'btn-finish' : 'btn-next'}" id="nextBtn">
                            ${isLast ? '🏁 Завершить' : 'Выполнено →'}
                        </button>
                    </div>
                </div>
            `;

            contentArea.innerHTML = html;

            document.getElementById('backBtn').addEventListener('click', () => {
                if (currentStep > 0) {
                    clearTimer();
                    currentStep--;
                    render();
                }
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                clearTimer();
                currentStep++;
                render();
            });
        }

        // ============================================================
        // ТАЙМЕР
        // ============================================================

        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            isTimerRunning = true;
            timerInterval = setInterval(() => {
                timerSeconds++;
                const remaining = Math.max(0, timerTotal - timerSeconds);
                const displayEl = document.getElementById('timerDisplay');
                const labelEl = document.getElementById('timerLabel');

                if (displayEl) {
                    displayEl.textContent = formatTime(remaining);
                }
                if (labelEl) {
                    labelEl.textContent = remaining > 0 ? 'Ожидание...' : 'Готово!';
                }

                if (remaining <= 0) {
                    clearTimer();
                }
            }, 1000);
        }

        function clearTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTimerRunning = false;
        }

        function renderFinish() {
            contentArea.innerHTML = `
                <div class="step-card">
                    <div class="finish-screen">
                        <div class="finish-icon">✅</div>
                        <div class="finish-title">Диагностика завершена!</div>
                        <div class="finish-sub">Не забудь заполнить журнал.</div>
                        <button class="finish-reset" id="resetBtn">🔄 Пройти заново</button>
                    </div>
                </div>
            `;
            document.getElementById('resetBtn').addEventListener('click', () => {
                clearTimer();
                currentStep = 0;
                timerSeconds = 0;
                timerTotal = 0;
                resetSignal();
                render();
            });
            updateProgress(100);
        }

        function updateProgress(value) {
            progressFill.style.width = value + '%';
            progressText.textContent = value + '%';
        }

        function formatTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        // ============================================================
        // PWA УСТАНОВКА
        // ============================================================

        let deferredPrompt = null;
        const installBanner = document.getElementById('installBanner');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    installBanner.classList.remove('show');
                }
                deferredPrompt = null;
            }
        });

        document.getElementById('installClose').addEventListener('click', () => {
            installBanner.classList.remove('show');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('✅ SW зарегистрирован'))
                .catch(() => console.log('⚠️ SW не зарегистрирован'));
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        signalPrevBtn.addEventListener('click', prevSignal);
        signalNextBtn.addEventListener('click', nextSignal);
        signalResetBtn.addEventListener('click', resetSignal);

        setupTableTapHandlers();
        refreshSignalUI();
        render();

        console.log('🚂 ТРПУ-17 загружена');
    </script>
</body>
</html>
